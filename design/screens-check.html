<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>screens check</title>
<link rel="stylesheet" href="../src/ui/screens.css">
<style>
  body{margin:0;background:#2a6fdb;position:relative;width:390px;height:844px;overflow:hidden}
  #bar{position:absolute;z-index:99;left:0;right:0;bottom:0;display:flex;gap:4px;padding:4px;background:#000a}
  #bar button{flex:1;font:11px monospace;padding:6px 0}
</style>
<div id="bar"></div>
<script type="module">
import { createScreens } from '../src/ui/screens.js';
const canvas = document.createElement('div');
canvas.style.left = '0px';
canvas.style.top = '0px';
const stage = { canvas, k: 1, width: 390, height: 844, onResize: () => () => {} };
const s = createScreens(document.body, stage);
const log = (n) => () => console.log(n);
const job = { id: 1, name: 'Corner Office Cleanout', blurb: 'The boss left in a hurry. Strip the floor of anything that is not nailed down, then the nails.', quota: 8000, duration: 900,
  hazards: ['Security drones patrol the lobby', 'Fragile server racks fine you $400 each'], crew: { breacher: 2, hauler: 3, rigger: 1, decoy: 1 }, bestStars: 2 };
const screens = {
  TITLE: () => s.showTitle({ bank: 12300, jobs: 5, canContinue: false }, { onPlay: log('play'), onSettings: log('settings') }),
  BRIEF: () => s.showBriefing(job, { onStart: log('start'), onBack: () => s.hide() }),
  PAUSE: () => s.showPause({ settings: { hints: true, sound: false, debug: false } }, { onResume: () => s.hide(), onSetting: (k, v) => console.log(k, v) }),
  WIN: () => s.showResults({ jobName: job.name, delivered: 9400, fines: 600, net: 8800, quota: 8000, stars: 2, bankDelta: 8800, bank: 21100, newBest: true }, {}),
  FAIL: () => s.showResults({ jobName: job.name, delivered: 2000, fines: 0, net: 2000, quota: 8000, stars: 0, bankDelta: 0, bank: 12300, newBest: false }, {}),
  HIDE: () => s.hide(),
};
for (const [k, f] of Object.entries(screens)) {
  const b = document.createElement('button');
  b.textContent = k;
  b.onclick = f;
  bar.appendChild(b);
}
screens.TITLE();
</script>
