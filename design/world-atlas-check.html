<!doctype html>
<meta charset="utf-8">
<title>World atlas check</title>
<style>
  body { background: #181425; color: #c0cbdc; font: 11px monospace; margin: 8px; }
  h2 { margin: 12px 0 4px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell { background: #262b44; border: 1px solid #3a4466; padding: 3px; text-align: center; }
  canvas { image-rendering: pixelated; display: block; margin: 0 auto 2px; }
</style>
<div id="out"></div>
<script type="module">
  import { buildWorldAtlas } from '../src/render/world-atlas.js';
  const atlas = buildWorldAtlas();
  const out = document.getElementById('out');
  for (const lod of ['lo', 'hi']) {
    const h = document.createElement('h2');
    h.textContent = `LOD ${lod}`;
    out.appendChild(h);
    const grid = document.createElement('div');
    grid.className = 'grid';
    out.appendChild(grid);
    for (const [kind, key] of atlas.entries(lod)) {
      const e = atlas.get(kind, key, lod);
      const c = document.createElement('canvas');
      c.width = e.w * 2;
      c.height = e.h * 2;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(e.canvas, e.sx, e.sy, e.w, e.h, 0, 0, e.w * 2, e.h * 2);
      ctx.fillStyle = '#ff0044';
      ctx.fillRect(e.ax * 2 - 1, e.ay * 2 - 1, 3, 3);
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.appendChild(c);
      cell.append(`${kind}:${key}`);
      grid.appendChild(cell);
    }
  }
</script>
